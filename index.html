<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeu et Leçon - Les Angles Droits</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f8ff;
            font-family: 'Comic Sans MS', 'Verdana', sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        /* --- BARRE DE NAVIGATION --- */
        #navbar {
            background-color: #2c3e50;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            position: relative;
            z-index: 200;
        }

        .tab-btn {
            background-color: #ecf0f1;
            color: #2c3e50;
            border: 4px solid #bdc3c7;
            padding: 10px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 15px;
            margin: 0 10px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #4CAF50;
            color: white;
            border-color: #2e7d32;
            transform: scale(1.1);
        }

        .tab-content {
            display: none;
            width: 100vw;
            height: calc(100vh - 80px);
        }

        .tab-content.active {
            display: block;
        }

        /* --- SECTION LEÇON --- */
        #tab-lecon {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #lecon-area {
            padding: 20px;
            text-align: center;
        }

        #lecon-area img {
            max-width: 90%;
            border: 5px solid #3498db;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .video-container {
            margin: 20px auto;
            max-width: 640px;
            border: 5px solid #e74c3c;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* --- SECTION JEU --- */
        #tab-jeu.active {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e0f7fa;
            position: relative;
        }

        #consigne {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff9800;
            color: white;
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 1.3rem;
            z-index: 10;
            border: 3px solid #e65100;
            text-align: center;
            white-space: nowrap;
        }

        #btn-rejouer-flottant {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #2196F3;
            color: white;
            border: 3px solid #1565C0;
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 150;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        #btn-rejouer-flottant:active {
            transform: scale(0.95);
        }

        /* Zone de jeu adaptative */
        #game-area {
            position: relative;
            width: 1000px;
            height: 700px;
            transform-origin: center center;
            touch-action: none;
        }

        .shape {
            position: absolute;
            fill: #3498db;
            stroke: #2980b9;
            stroke-width: 6;
            overflow: visible; /* Permet aux bordures de ne pas être rognées */
        }

        /* Le marqueur d'angle droit : Un vrai petit carré rouge ! */
        .marker {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #ff3333;
            border: 2px solid darkred;
            display: none;
            z-index: 5;
            transform-origin: 0 0; /* Important pour qu'il s'insère parfaitement dans le coin */
            pointer-events: none;
        }

        /* --- L'ÉQUERRE --- */
        #equerre-container {
            position: absolute;
            left: 0; 
            top: 0;
            width: 250px;
            height: 250px;
            transform-origin: 0 0;
            z-index: 100;
            filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.4));
            touch-action: none;
            cursor: grab;
            background-color: rgba(255, 255, 255, 0.01); 
        }

        #equerre-container:active {
            cursor: grabbing;
        }

        /* Poignée pour pivoter */
        #rotate-handle {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: #e91e63;
            border: 4px solid white;
            border-radius: 50%;
            left: 80px; 
            top: 80px;
            transform: translate(-50%, -50%);
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        
        #rotate-handle.active {
            background-color: #c2185b;
            cursor: grabbing;
        }

        #message-victoire {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ffeb3b;
            color: #d32f2f;
            padding: 30px 50px;
            border-radius: 20px;
            font-size: 2.5rem;
            font-weight: bold;
            border: 6px dashed #d32f2f;
            display: none;
            z-index: 200;
            text-align: center;
            animation: pop 0.5s ease-out;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btn-victoire {
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            border: 4px solid #2e7d32;
            padding: 10px 30px;
            font-size: 1.5rem;
            border-radius: 15px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-victoire:active {
            transform: scale(0.95);
        }

        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <!-- BARRE DE NAVIGATION -->
    <div id="navbar">
        <button class="tab-btn active" onclick="switchTab('lecon', this)">📖 La Leçon</button>
        <button class="tab-btn" onclick="switchTab('jeu', this)">🎮 Le Jeu</button>
    </div>

    <!-- ONGLET LEÇON -->
    <div id="tab-lecon" class="tab-content active">
        <div id="lecon-area">
            <h1>Leçon : Les formes et les angles droits</h1>
            <img src="lecon.png" alt="Leçon sur le carré" onerror="this.outerHTML='<p style=\'color:red; font-size:1.5rem; margin-top:20px;\'>⚠️ L\'image <b>lecon.png</b> est introuvable. N\'oublie pas de la placer dans le même dossier que ce fichier.</p>'">
            <div class="video-container">
                <iframe src="https://lesfondamentaux.reseau-canope.fr/embed/video/decrire-le-carre" width="100%" height="360" frameborder="0" allowfullscreen="true"></iframe>
            </div>
        </div>
    </div>

    <!-- ONGLET JEU -->
    <div id="tab-jeu" class="tab-content">
        <button id="btn-rejouer-flottant" onclick="initGame()">🔄 Nouveau tirage</button>
        <div id="consigne">Trouve le carré ! Aligne parfaitement l'équerre pour révéler les angles droits.</div>
        
        <div id="game-area">
            <!-- Formes dynamiques -->
            <svg class="shape" id="shape-carre">
                <polygon points="" />
            </svg>

            <svg class="shape" id="shape-losange1">
                <polygon points="" />
            </svg>

            <svg class="shape" id="shape-losange2">
                <polygon points="" />
            </svg>

            <!-- Marqueurs -->
            <div id="marker-0" class="marker"></div>
            <div id="marker-1" class="marker"></div>
            <div id="marker-2" class="marker"></div>
            <div id="marker-3" class="marker"></div>

            <!-- L'ÉQUERRE -->
            <div id="equerre-container">
                <svg width="250" height="250" viewBox="0 0 250 250" style="position: absolute; left: 0; top: 0; pointer-events: none;">
                    <polygon points="0,0 200,0 0,200" fill="rgba(255, 235, 59, 0.8)" stroke="#fbc02d" stroke-width="2"/>
                    <polygon points="25,25 125,25 25,125" fill="#e0f7fa" stroke="#fbc02d" stroke-width="2"/>
                    <rect x="0" y="0" width="20" height="20" fill="none" stroke="red" stroke-width="4"/>
                    <line x1="20" y1="0" x2="20" y2="5" stroke="black" stroke-width="2"/><line x1="40" y1="0" x2="40" y2="5" stroke="black" stroke-width="2"/>
                    <line x1="60" y1="0" x2="60" y2="5" stroke="black" stroke-width="2"/><line x1="80" y1="0" x2="80" y2="5" stroke="black" stroke-width="2"/>
                    <line x1="100" y1="0" x2="100" y2="10" stroke="black" stroke-width="3"/>
                    <line x1="0" y1="20" x2="5" y2="20" stroke="black" stroke-width="2"/><line x1="0" y1="40" x2="5" y2="40" stroke="black" stroke-width="2"/>
                    <line x1="0" y1="60" x2="5" y2="60" stroke="black" stroke-width="2"/><line x1="0" y1="80" x2="5" y2="80" stroke="black" stroke-width="2"/>
                    <line x1="0" y1="100" x2="10" y2="100" stroke="black" stroke-width="3"/>
                </svg>
                
                <div id="rotate-handle">⟲</div>
            </div>
        </div>
    </div>

    <div id="message-victoire">
        🎉 Bravo ! Tu as vérifié les 4 angles droits du carré ! 🎉<br>
        <button class="btn-victoire" onclick="initGame()">Refaire une partie</button>
    </div>

    <script>
        /* --- GESTION DES ONGLETS ET AFFICHAGE --- */
        let scale = 1;
        const gameArea = document.getElementById('game-area');

        function resizeGameArea() {
            const tabJeu = document.getElementById('tab-jeu');
            if (tabJeu.classList.contains('active')) {
                let w = tabJeu.clientWidth;
                let h = tabJeu.clientHeight;
                if (w === 0 || h === 0) return;
                
                scale = Math.min(w / 1000, h / 700);
                scale = Math.max(0.1, scale); 
                gameArea.style.transform = `scale(${scale})`;
            }
        }
        window.addEventListener('resize', resizeGameArea);

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
            
            // On cache toujours le message de victoire lorsqu'on change d'onglet
            document.getElementById('message-victoire').style.display = 'none';

            if(tabId === 'jeu') {
                setTimeout(resizeGameArea, 50); 
            }
        }

        /* --- LOGIQUE DU JEU GEOMETRIE --- */
        const equerre = document.getElementById('equerre-container');
        const rotateHandle = document.getElementById('rotate-handle');
        
        let isDragging = false;
        let isRotating = false;
        let startPointerX = 0, startPointerY = 0;
        let initialEqX = 500, initialEqY = 350;
        
        let eqX = 500;
        let eqY = 350;
        let eqRotation = 0;
        let anglesTrouves = [false, false, false, false];
        let targets = [];

        function updateEquerre() {
            equerre.style.transform = `translate(${eqX}px, ${eqY}px) rotate(${eqRotation}deg)`;
            return checkAngles();
        }

        /* --- GENERATION ALEATOIRE DES FORMES --- */
        function getRotatedPoint(cx, cy, x_offset, y_offset, angleDeg) {
            let rad = angleDeg * Math.PI / 180;
            let nx = x_offset * Math.cos(rad) - y_offset * Math.sin(rad);
            let ny = x_offset * Math.sin(rad) + y_offset * Math.cos(rad);
            return { x: cx + nx, y: cy + ny };
        }

        function initGame() {
            // Cacher le message de victoire
            document.getElementById('message-victoire').style.display = 'none';
            anglesTrouves = [false, false, false, false];

            // Cacher les carrés rouges
            for(let i=0; i<4; i++) {
                document.getElementById('marker-'+i).style.display = 'none';
            }

            // Générer 3 emplacements de base (Gauche, Milieu, Droite) avec une petite part d'aléatoire
            let slots = [
                { cx: 200 + (Math.random()*60 - 30), cy: 350 + (Math.random()*100 - 50) },
                { cx: 500 + (Math.random()*60 - 30), cy: 350 + (Math.random()*100 - 50) },
                { cx: 800 + (Math.random()*60 - 30), cy: 350 + (Math.random()*100 - 50) }
            ];
            // Mélanger les emplacements pour que le carré ne soit jamais au même endroit
            slots.sort(() => Math.random() - 0.5);

            // 1. LE CARRÉ
            let side = Math.floor(Math.random() * 60) + 140; // Taille entre 140 et 200px
            let sqAngle = Math.floor(Math.random() * 360);
            let carreSvg = document.getElementById('shape-carre');
            carreSvg.style.width = side + 'px';
            carreSvg.style.height = side + 'px';
            carreSvg.style.left = (slots[0].cx - side/2) + 'px';
            carreSvg.style.top = (slots[0].cy - side/2) + 'px';
            carreSvg.style.transform = `rotate(${sqAngle}deg)`;
            carreSvg.querySelector('polygon').setAttribute('points', `0,0 ${side},0 ${side},${side} 0,${side}`);

            // Cibles d'angles pour le Carré
            const half = side / 2;
            targets = [
                { ...getRotatedPoint(slots[0].cx, slots[0].cy, -half, -half, sqAngle), rot: sqAngle, id: 0 },
                { ...getRotatedPoint(slots[0].cx, slots[0].cy, half, -half, sqAngle), rot: sqAngle + 90, id: 1 },
                { ...getRotatedPoint(slots[0].cx, slots[0].cy, half, half, sqAngle), rot: sqAngle + 180, id: 2 },
                { ...getRotatedPoint(slots[0].cx, slots[0].cy, -half, half, sqAngle), rot: sqAngle + 270, id: 3 }
            ];

            // Placement des repères rouges invisibles
            targets.forEach((t, i) => {
                const m = document.getElementById(`marker-${i}`);
                m.style.left = t.x + 'px';
                m.style.top = t.y + 'px';
                m.style.transform = `rotate(${t.rot}deg)`;
            });

            // 2. LE LOSANGE 1 (Même longueur de côté que le carré)
            let w1 = Math.floor(Math.random() * (side * 1.6 - side * 0.6)) + side * 0.6;
            if (Math.abs(w1 - side) < 15) w1 += 20; // S'assure que le losange n'est pas un carré parfait
            let h1 = 2 * Math.sqrt(side * side - (w1 / 2) * (w1 / 2));
            let rAngle1 = Math.floor(Math.random() * 360);
            let r1Svg = document.getElementById('shape-losange1');
            r1Svg.style.width = w1 + 'px';
            r1Svg.style.height = h1 + 'px';
            r1Svg.style.left = (slots[1].cx - w1/2) + 'px';
            r1Svg.style.top = (slots[1].cy - h1/2) + 'px';
            r1Svg.style.transform = `rotate(${rAngle1}deg)`;
            r1Svg.querySelector('polygon').setAttribute('points', `${w1/2},0 ${w1},${h1/2} ${w1/2},${h1} 0,${h1/2}`);

            // 3. LE LOSANGE 2
            let w2 = Math.floor(Math.random() * (side * 1.6 - side * 0.6)) + side * 0.6;
            if (Math.abs(w2 - side) < 15) w2 -= 20;
            let h2 = 2 * Math.sqrt(side * side - (w2 / 2) * (w2 / 2));
            let rAngle2 = Math.floor(Math.random() * 360);
            let r2Svg = document.getElementById('shape-losange2');
            r2Svg.style.width = w2 + 'px';
            r2Svg.style.height = h2 + 'px';
            r2Svg.style.left = (slots[2].cx - w2/2) + 'px';
            r2Svg.style.top = (slots[2].cy - h2/2) + 'px';
            r2Svg.style.transform = `rotate(${rAngle2}deg)`;
            r2Svg.querySelector('polygon').setAttribute('points', `${w2/2},0 ${w2},${h2/2} ${w2/2},${h2} 0,${h2/2}`);

            // Réinitialiser la position de l'équerre (au centre en bas, hors des formes)
            eqX = 375;
            eqY = 400;
            eqRotation = 0;
            updateEquerre();
        }

        /* --- SYSTEME D'EVENEMENTS FIABLE (SOURIS & TACTILE) --- */
        function getClientPos(e) {
            if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        function handleStart(e) {
            e.preventDefault(); 
            let pos = getClientPos(e);

            if (e.target.id === 'rotate-handle' || (e.target.parentNode && e.target.parentNode.id === 'rotate-handle')) {
                isRotating = true;
                rotateHandle.classList.add('active');
            } else {
                isDragging = true;
            }

            startPointerX = pos.x;
            startPointerY = pos.y;
            initialEqX = eqX;
            initialEqY = eqY;
        }

        equerre.addEventListener('mousedown', handleStart, { passive: false });
        equerre.addEventListener('touchstart', handleStart, { passive: false });

        function handleMove(e) {
            if (!isDragging && !isRotating) return;
            e.preventDefault();

            let pos = getClientPos(e);
            let safeScale = Math.max(0.1, scale); 

            if (isDragging) {
                let dx = (pos.x - startPointerX) / safeScale;
                let dy = (pos.y - startPointerY) / safeScale;
                eqX = initialEqX + dx;
                eqY = initialEqY + dy;
            } 
            else if (isRotating) {
                let gameRect = gameArea.getBoundingClientRect();
                let pivotScreenX = gameRect.left + (eqX * safeScale);
                let pivotScreenY = gameRect.top + (eqY * safeScale);

                let angleRad = Math.atan2(pos.y - pivotScreenY, pos.x - pivotScreenX);
                let angleDeg = angleRad * (180 / Math.PI);
                
                eqRotation = angleDeg - 45; 
                if (eqRotation < 0) eqRotation += 360;
            }
            
            let snapped = updateEquerre();
            
            // Si l'équerre vient de s'aimanter, on réinitialise l'ancrage 
            // pour qu'elle ne saute pas si l'élève bouge encore un peu le doigt
            if (snapped) {
                startPointerX = pos.x;
                startPointerY = pos.y;
                initialEqX = eqX;
                initialEqY = eqY;
            }
        }

        window.addEventListener('mousemove', handleMove, { passive: false });
        window.addEventListener('touchmove', handleMove, { passive: false });

        function handleEnd() {
            isDragging = false;
            isRotating = false;
            rotateHandle.classList.remove('active');
        }

        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchend', handleEnd);

        /* --- ROTATION AVEC LA MOLETTE DE LA SOURIS --- */
        equerre.addEventListener('wheel', (e) => {
            e.preventDefault();
            let direction = e.deltaY > 0 ? 1 : -1;
            eqRotation += direction * 5; 
            
            if (eqRotation < 0) eqRotation += 360;
            updateEquerre();
        }, {passive: false});

        /* --- VERIFICATION DES ANGLES --- */
        function checkAngles() {
            let justSnapped = false;
            targets.forEach((target, index) => {
                if (anglesTrouves[index]) return;

                let dist = Math.sqrt(Math.pow(eqX - target.x, 2) + Math.pow(eqY - target.y, 2));
                
                let expectedRot = target.rot % 360;
                let currentRot = eqRotation % 360;
                if (currentRot < 0) currentRot += 360;
                let rotDiff = Math.abs(currentRot - expectedRot);
                if (rotDiff > 180) rotDiff = 360 - rotDiff;

                // Tolérance stricte pour obliger à bien aligner les bords (6 degrés max !)
                if (dist < 20 && rotDiff < 6) {
                    anglesTrouves[index] = true;
                    
                    // --- EFFET D'AIMANTATION (MAGNÉTISME) ---
                    eqX = target.x;
                    eqY = target.y;
                    eqRotation = target.rot;
                    equerre.style.transform = `translate(${eqX}px, ${eqY}px) rotate(${eqRotation}deg)`;
                    justSnapped = true;
                    // ----------------------------------------

                    document.getElementById(`marker-${index}`).style.display = 'block';
                    checkVictoire();
                }
            });
            return justSnapped;
        }

        function checkVictoire() {
            if (anglesTrouves.every(val => val === true)) {
                setTimeout(() => {
                    document.getElementById('message-victoire').style.display = 'block';
                }, 500);
            }
        }

        // Lancer la première partie
        initGame();
    </script>
</body>
</html>
