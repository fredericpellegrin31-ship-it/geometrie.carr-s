<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeu et Leçon - Les Angles Droits</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f8ff;
            font-family: 'Comic Sans MS', 'Verdana', sans-serif;
            overflow: hidden;
            touch-action: none; /* Empêche tout mouvement d'écran parasite */
            user-select: none;
        }

        /* --- BARRE DE NAVIGATION --- */
        #navbar {
            background-color: #2c3e50;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            position: relative;
            z-index: 200;
        }

        .tab-btn {
            background-color: #ecf0f1;
            color: #2c3e50;
            border: 4px solid #bdc3c7;
            padding: 10px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 15px;
            margin: 0 10px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #4CAF50;
            color: white;
            border-color: #2e7d32;
            transform: scale(1.1);
        }

        .tab-content {
            display: none;
            width: 100vw;
            height: calc(100vh - 80px);
        }

        .tab-content.active {
            display: block;
        }

        /* --- SECTION LEÇON --- */
        #tab-lecon {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #lecon-area {
            padding: 20px;
            text-align: center;
        }

        #lecon-area img {
            max-width: 90%;
            border: 5px solid #3498db;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .video-container {
            margin: 20px auto;
            max-width: 640px;
            border: 5px solid #e74c3c;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* --- SECTION JEU --- */
        #tab-jeu.active {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e0f7fa;
        }

        #consigne {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff9800;
            color: white;
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 1.3rem;
            z-index: 10;
            border: 3px solid #e65100;
            text-align: center;
            white-space: nowrap;
        }

        /* Zone de jeu adaptative */
        #game-area {
            position: relative;
            width: 1000px;
            height: 700px;
            transform-origin: center center;
            touch-action: none;
        }

        .shape {
            position: absolute;
            fill: #3498db;
            stroke: #2980b9;
            stroke-width: 6;
        }

        .marker {
            position: absolute;
            width: 25px;
            height: 25px;
            border: 5px solid red;
            border-top: none;
            border-right: none;
            display: none;
            z-index: 5;
            transform-origin: 0 0;
        }

        /* --- L'ÉQUERRE --- */
        #equerre-container {
            position: absolute;
            left: 0; 
            top: 0;
            width: 250px;
            height: 250px;
            transform-origin: 0 0; /* Angle droit en haut à gauche */
            z-index: 100;
            filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.4));
            touch-action: none;
            cursor: grab;
            /* Astuce magique : fond quasi-transparent pour que le bloc ENTIER capte la souris et la molette */
            background-color: rgba(255, 255, 255, 0.01); 
        }

        #equerre-container:active {
            cursor: grabbing;
        }

        /* Poignée pour pivoter */
        #rotate-handle {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: #e91e63;
            border: 4px solid white;
            border-radius: 50%;
            left: 80px; 
            top: 80px;
            transform: translate(-50%, -50%);
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        
        #rotate-handle.active {
            background-color: #c2185b;
            cursor: grabbing;
        }

        #message-victoire {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ffeb3b;
            color: #d32f2f;
            padding: 30px 50px;
            border-radius: 20px;
            font-size: 2.5rem;
            font-weight: bold;
            border: 6px dashed #d32f2f;
            display: none;
            z-index: 200;
            text-align: center;
            animation: pop 0.5s ease-out;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <!-- BARRE DE NAVIGATION -->
    <div id="navbar">
        <button class="tab-btn active" onclick="switchTab('lecon', this)">📖 La Leçon</button>
        <button class="tab-btn" onclick="switchTab('jeu', this)">🎮 Le Jeu</button>
    </div>

    <!-- ONGLET LEÇON -->
    <div id="tab-lecon" class="tab-content active">
        <div id="lecon-area">
            <h1>Leçon : Les formes et les angles droits</h1>
            <img src="lecon.png" alt="Leçon sur le carré" onerror="this.outerHTML='<p style=\'color:red; font-size:1.5rem; margin-top:20px;\'>⚠️ L\'image <b>lecon.png</b> est introuvable. N\'oublie pas de la placer dans le même dossier que ce fichier.</p>'">
            <div class="video-container">
                <iframe src="https://lesfondamentaux.reseau-canope.fr/embed/video/decrire-le-carre" width="100%" height="360" frameborder="0" allowfullscreen="true"></iframe>
            </div>
        </div>
    </div>

    <!-- ONGLET JEU -->
    <div id="tab-jeu" class="tab-content">
        <div id="consigne">Trouve le carré ! Glisse l'équerre et utilise le bouton rose (ou la molette) pour pivoter.</div>
        
        <div id="game-area">
            <!-- Carré et Losanges -->
            <svg class="shape" id="shape-carre" style="left: 150px; top: 250px; width: 200px; height: 200px; transform: rotate(15deg);">
                <polygon points="0,0 200,0 200,200 0,200" />
            </svg>

            <svg class="shape" style="left: 450px; top: 180px; width: 320px; height: 240px; transform: rotate(-20deg);">
                <polygon points="160,0 320,120 160,240 0,120" />
            </svg>

            <svg class="shape" style="left: 600px; top: 450px; width: 384px; height: 112px; transform: rotate(35deg);">
                <polygon points="192,0 384,56 192,112 0,56" />
            </svg>

            <!-- Marqueurs -->
            <div id="marker-0" class="marker"></div>
            <div id="marker-1" class="marker"></div>
            <div id="marker-2" class="marker"></div>
            <div id="marker-3" class="marker"></div>

            <!-- L'ÉQUERRE -->
            <div id="equerre-container">
                <!-- Dessin graphique de l'équerre -->
                <svg width="250" height="250" viewBox="0 0 250 250" style="position: absolute; left: 0; top: 0; pointer-events: none;">
                    <polygon points="0,0 200,0 0,200" fill="rgba(255, 235, 59, 0.8)" stroke="#fbc02d" stroke-width="2"/>
                    <polygon points="25,25 125,25 25,125" fill="#e0f7fa" stroke="#fbc02d" stroke-width="2"/>
                    <rect x="0" y="0" width="20" height="20" fill="none" stroke="red" stroke-width="4"/>
                    <line x1="20" y1="0" x2="20" y2="5" stroke="black" stroke-width="2"/><line x1="40" y1="0" x2="40" y2="5" stroke="black" stroke-width="2"/>
                    <line x1="60" y1="0" x2="60" y2="5" stroke="black" stroke-width="2"/><line x1="80" y1="0" x2="80" y2="5" stroke="black" stroke-width="2"/>
                    <line x1="100" y1="0" x2="100" y2="10" stroke="black" stroke-width="3"/>
                    <line x1="0" y1="20" x2="5" y2="20" stroke="black" stroke-width="2"/><line x1="0" y1="40" x2="5" y2="40" stroke="black" stroke-width="2"/>
                    <line x1="0" y1="60" x2="5" y2="60" stroke="black" stroke-width="2"/><line x1="0" y1="80" x2="5" y2="80" stroke="black" stroke-width="2"/>
                    <line x1="0" y1="100" x2="10" y2="100" stroke="black" stroke-width="3"/>
                </svg>
                
                <!-- Poignée de rotation au premier plan -->
                <div id="rotate-handle">⟲</div>
            </div>
        </div>
    </div>

    <div id="message-victoire">
        🎉 Bravo ! Tu as vérifié les 4 angles droits du carré ! 🎉
    </div>

    <script>
        /* --- GESTION DES ONGLETS ET AFFICHAGE --- */
        let scale = 1;
        const gameArea = document.getElementById('game-area');

        function resizeGameArea() {
            const tabJeu = document.getElementById('tab-jeu');
            if (tabJeu.classList.contains('active')) {
                let w = tabJeu.clientWidth;
                let h = tabJeu.clientHeight;
                if (w === 0 || h === 0) return;
                
                scale = Math.min(w / 1000, h / 700);
                scale = Math.max(0.1, scale); 
                gameArea.style.transform = `scale(${scale})`;
            }
        }
        window.addEventListener('resize', resizeGameArea);

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
            
            if(tabId === 'jeu') {
                setTimeout(resizeGameArea, 50); 
            }
        }

        /* --- LOGIQUE DU JEU GEOMETRIE --- */
        const equerre = document.getElementById('equerre-container');
        const rotateHandle = document.getElementById('rotate-handle');
        
        let isDragging = false;
        let isRotating = false;
        let startPointerX = 0, startPointerY = 0;
        let initialEqX = 500, initialEqY = 350;
        
        let eqX = 500;
        let eqY = 350;
        let eqRotation = 0;
        let anglesTrouves = [false, false, false, false];

        function updateEquerre() {
            equerre.style.transform = `translate(${eqX}px, ${eqY}px) rotate(${eqRotation}deg)`;
            checkAngles();
        }

        /* --- SYSTEME D'EVENEMENTS FIABLE (SOURIS & TACTILE) --- */
        
        function getClientPos(e) {
            if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        // On déclenche l'action quand on clique/touche la zone de l'équerre
        function handleStart(e) {
            e.preventDefault(); 
            let pos = getClientPos(e);

            // On vérifie si on a cliqué sur le bouton rose de rotation
            if (e.target.id === 'rotate-handle' || (e.target.parentNode && e.target.parentNode.id === 'rotate-handle')) {
                isRotating = true;
                rotateHandle.classList.add('active');
            } else {
                isDragging = true;
            }

            startPointerX = pos.x;
            startPointerY = pos.y;
            initialEqX = eqX;
            initialEqY = eqY;
        }

        equerre.addEventListener('mousedown', handleStart, { passive: false });
        equerre.addEventListener('touchstart', handleStart, { passive: false });

        // On suit le mouvement sur toute la page pour ne jamais perdre l'équerre
        function handleMove(e) {
            if (!isDragging && !isRotating) return;
            e.preventDefault();

            let pos = getClientPos(e);
            let safeScale = Math.max(0.1, scale); 

            if (isDragging) {
                let dx = (pos.x - startPointerX) / safeScale;
                let dy = (pos.y - startPointerY) / safeScale;
                eqX = initialEqX + dx;
                eqY = initialEqY + dy;
            } 
            else if (isRotating) {
                let gameRect = gameArea.getBoundingClientRect();
                let pivotScreenX = gameRect.left + (eqX * safeScale);
                let pivotScreenY = gameRect.top + (eqY * safeScale);

                let angleRad = Math.atan2(pos.y - pivotScreenY, pos.x - pivotScreenX);
                let angleDeg = angleRad * (180 / Math.PI);
                
                eqRotation = angleDeg - 45; 
                if (eqRotation < 0) eqRotation += 360;
            }
            updateEquerre();
        }

        window.addEventListener('mousemove', handleMove, { passive: false });
        window.addEventListener('touchmove', handleMove, { passive: false });

        // On arrête l'action quand on lâche le bouton
        function handleEnd() {
            isDragging = false;
            isRotating = false;
            rotateHandle.classList.remove('active');
        }

        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchend', handleEnd);

        /* --- ROTATION AVEC LA MOLETTE DE LA SOURIS --- */
        equerre.addEventListener('wheel', (e) => {
            e.preventDefault();
            // e.deltaY indique le sens de la molette
            let direction = e.deltaY > 0 ? 1 : -1;
            eqRotation += direction * 5; // Pivote de 5 degrés
            
            if (eqRotation < 0) eqRotation += 360;
            updateEquerre();
        }, {passive: false});


        /* --- VERIFICATION DES ANGLES --- */
        const carre = { cx: 250, cy: 350, size: 200, angle: 15 };
        const half = carre.size / 2;

        function getRotatedPoint(cx, cy, x_offset, y_offset, angleDeg) {
            let rad = angleDeg * Math.PI / 180;
            let nx = x_offset * Math.cos(rad) - y_offset * Math.sin(rad);
            let ny = x_offset * Math.sin(rad) + y_offset * Math.cos(rad);
            return { x: cx + nx, y: cy + ny };
        }

        const targets = [
            { ...getRotatedPoint(carre.cx, carre.cy, -half, -half, carre.angle), rot: carre.angle, id: 0 },
            { ...getRotatedPoint(carre.cx, carre.cy, half, -half, carre.angle), rot: carre.angle + 90, id: 1 },
            { ...getRotatedPoint(carre.cx, carre.cy, half, half, carre.angle), rot: carre.angle + 180, id: 2 },
            { ...getRotatedPoint(carre.cx, carre.cy, -half, half, carre.angle), rot: carre.angle + 270, id: 3 }
        ];

        targets.forEach((t, i) => {
            const m = document.getElementById(`marker-${i}`);
            m.style.left = t.x + 'px';
            m.style.top = t.y + 'px';
            m.style.transform = `rotate(${t.rot}deg)`;
        });

        function checkAngles() {
            targets.forEach((target, index) => {
                if (anglesTrouves[index]) return;

                let dist = Math.sqrt(Math.pow(eqX - target.x, 2) + Math.pow(eqY - target.y, 2));
                
                let expectedRot = target.rot % 360;
                let currentRot = eqRotation % 360;
                let rotDiff = Math.abs(currentRot - expectedRot);
                if (rotDiff > 180) rotDiff = 360 - rotDiff;

                if (dist < 20 && rotDiff < 15) {
                    anglesTrouves[index] = true;
                    document.getElementById(`marker-${index}`).style.display = 'block';
                    checkVictoire();
                }
            });
        }

        function checkVictoire() {
            if (anglesTrouves.every(val => val === true)) {
                setTimeout(() => {
                    document.getElementById('message-victoire').style.display = 'block';
                }, 500);
            }
        }

        // On appelle la fonction de mise à jour tout à la fin, 
        // une fois que 'targets' a été complètement initialisé.
        updateEquerre();
    </script>
</body>
</html>
